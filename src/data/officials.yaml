# The roster shown to the player, one entry at a time.
#
# Edit freely: add/remove people, fix titles, swap photos. Each `photo` path is
# resolved against /public (so "officials/foo.jpg" -> public/officials/foo.jpg).
# `source` / `license` are for attribution only and are not shown in-game.
#
# Portraits here are official U.S. government portraits, which are in the public
# domain as works of the federal government. See ATTRIBUTIONS.md.

